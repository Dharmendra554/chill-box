# Build and publish to GitHub Pages.
#
# Free, no account beyond GitHub, and no fair-use ceiling — which is why it
# is here rather than Vercel. The site is served from /<repo>/, so BASE_PATH
# is passed to Vite; see vite.config.ts.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions are granted per job, not workflow-wide. The build job runs
# third-party code — every dependency's test and build script — and must not
# hold the token that can publish the site. Only the deploy job, which runs
# one pinned action and nothing of ours, can write Pages.
permissions: {}

# One deploy at a time; never cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # `--ignore-scripts`: a dependency's install script runs before any gate
      # does, with the job's token and network. Three packages in the lock
      # file declare one — @firebase/util, protobufjs and fsevents (macOS) —
      # and none is needed to build this app. Verified, not assumed: a clean
      # `npm ci --ignore-scripts` in an empty tree still passes tsc, every
      # test in the suite and the build. (Count them with `npm test`; three
      # rounds have now shipped a stale number in a sentence whose whole
      # point is that the claim was verified rather than assumed.)
      - run: npm ci --ignore-scripts
      # The same four gates that must pass locally, in the same order. The
      # deploy job below has `needs: build`, so a red gate never publishes.
      #
      # `--no-install` on every npx: these three binaries are devDependencies
      # already installed by `npm ci`, and without the flag a typo or a
      # dependency that failed to install makes npx silently fetch a package
      # of that name from the registry and run it. The gate would then be
      # some stranger's code, and it would go green.
      - run: npx --no-install tsc -b
      - run: npm test
      - run: npx --no-install oxlint
      - run: npm run build
        env:
          BASE_PATH: /chill-box/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      # The database rules, with the same push that deploys the client.
      #
      # Every push has always deployed new client code; the rules only moved
      # when a human remembered. That asymmetry is not a process problem, it
      # is a defect generator: it once left the published rules refusing a
      # field the client had started writing, which bricked registration and
      # made the app blame the network (MEMORY §16). A client and the rules
      # it assumes have to travel together.
      #
      # Skipped when the token is absent, so a fork or a clone still builds.
      # Create one with `npx firebase-tools login:ci` and add it as the
      # FIREBASE_TOKEN repository secret.
      #
      # NO `if:` ON THIS STEP, and that is the whole point. Two rounds have
      # now written a step condition that could never be true: first
      # `secrets.FIREBASE_TOKEN != ''` (the `secrets` context is not available
      # to a step `if:`), then `env.FIREBASE_TOKEN != ''` — and a step's own
      # `env:` block is NOT visible to that same step's `if:` either; only
      # workflow- and job-level env is. Both resolved to false on every run,
      # including runs where the secret existed, and both went green and said
      # nothing. A guard that silently never fires is worse than no guard,
      # because it also stops anyone looking. So the step always runs and the
      # check is in the shell, where a skip has to announce itself.
      - name: Deploy database rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::warning title=Database rules NOT deployed::No FIREBASE_TOKEN secret. The client shipped; firebase/database.rules.json did not. Create one with 'npx firebase-tools login:ci'."
            exit 0
          fi
          # Pinned exactly. `firebase-tools` is not a devDependency — it is
          # ~200 MB that every `npm ci` would pay for a step that runs once —
          # so it is fetched here, and an unpinned fetch means the code that
          # rewrites our security rules is whatever the registry served that
          # morning. Bump this deliberately.
          npx --yes firebase-tools@15.29.0 deploy --only database --token "$FIREBASE_TOKEN"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
